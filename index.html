<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഫണ്ട് കളക്ഷൻ ട്രാക്കർ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #95a5a6;
        }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 0;
            width: auto;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
        .total-box {
            background-color: #e8f8f5;
            border: 2px solid #27ae60;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
        }
        .status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 8px;
            color: #7f8c8d;
        }
        .loader {
            text-align: center;
            color: #3498db;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ഫണ്ട് കളക്ഷൻ എന്റ്രി</h2>
    
    <div class="form-group">
        <label for="name">പേര് / വീട്ടുപേര്:</label>
        <input type="text" id="name" placeholder="ഉദാ: രമേഷ് / റോസ് വില്ല" required>
    </div>

    <div class="form-group">
        <label for="amount">തുക (₹):</label>
        <input type="number" id="amount" placeholder="ഉദാ: 500" required>
    </div>

    <button id="submitBtn" onclick="addEntry()">Google Sheet-ലേക്ക് സേവ് ചെയ്യുക</button>
    <div id="status" class="status-msg"></div>

    <div class="total-box">
        ആകെ കിട്ടിയത്: ₹ <span id="totalAmount">0</span>
    </div>

    <table id="fundTable">
        <thead>
            <tr>
                <th>#</th>
                <th>പേര്</th>
                <th>തുക (₹)</th>
                <th>മാറ്റുക</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" class="loader">ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // നൽകിയ Web App URL സജ്ജീകരിച്ചു
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWD-ZivgIIQ4w2VVT7XaHkLUm1roBTV_YqUoEP2SAcd-fBAMX_SGZodM3CtJySomRx6g/exec";

    window.onload = function() {
        loadData();
    };

    function loadData() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => renderData(data))
            .catch(err => handleError(err));
    }

    function addEntry() {
        const nameInput = document.getElementById('name');
        const amountInput = document.getElementById('amount');
        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');

        const name = nameInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (name === "" || isNaN(amount) || amount <= 0) {
            alert("ദയവായി പേരും ശരിയായ തുകയും നൽകുക.");
            return;
        }

        submitBtn.disabled = true;
        status.innerText = "സേവ് ചെയ്യുന്നു...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, amount: amount })
        })
        .then(() => {
            status.innerText = "വിജയകരമായി സേവ് ചെയ്തു!";
            nameInput.value = '';
            amountInput.value = '';
            submitBtn.disabled = false;
            
            setTimeout(() => {
                loadData();
                status.innerText = '';
            }, 1500);
        })
        .catch(err => {
            handleError(err);
            submitBtn.disabled = false;
        });
    }

    function deleteEntry(rowIndex) {
        if (!confirm("ഈ എൻട്രി ഡിലീറ്റ് ചെയ്യണം എന്ന് ഉറപ്പാണോ?")) return;

        const status = document.getElementById('status');
        status.innerText = "ഡിലീറ്റ് ചെയ്യുന്നു...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
        })
        .then(() => {
            status.innerText = "വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!";
            setTimeout(() => {
                loadData();
                status.innerText = '';
            }, 1500);
        })
        .catch(err => handleError(err));
    }

    function renderData(data) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        if (!data || !data.entries || data.entries.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">എൻട്രികളൊന്നും ലഭ്യമല്ല</td></tr>';
            document.getElementById('totalAmount').innerText = '0';
            return;
        }

        data.entries.forEach((entry, index) => {
            const row = tableBody.insertRow();
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${entry.name}</td>
                <td>₹ ${Number(entry.amount).toLocaleString('en-IN')}</td>
                <td><button class="delete-btn" onclick="deleteEntry(${entry.rowIndex})">ഒഴിവാക്കുക</button></td>
            `;
        });

        document.getElementById('totalAmount').innerText = Number(data.total).toLocaleString('en-IN');
    }

    function handleError(error) {
        console.error('Error:', error);
        document.getElementById('status').innerText = "പ്രവർത്തനത്തിൽ തടസ്സം നേരിട്ടു. വീണ്ടും ശ്രമിക്കുക.";
    }
</script>

</body>
</html>
